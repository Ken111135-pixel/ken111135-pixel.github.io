<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>15秒ガチャラッシュ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Dela+Gothic+One&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* 15秒ガチャ: ゲームセンターの夜。深い紫の筐体に、ガチャ玉のポップな色を散らす。ランクの色は景品の価値そのものとして扱う。 */
:root{--adh:calc(50px + env(safe-area-inset-bottom,0px));--bg:#130e2b;--bg2:#1f1747;--panel:#251c55;--ink:#f7f3ff;--mute:#a9a1cf;--line:#3d3275;
--pop:#ff5fa2;--pop-d:#b02a68;--sun:#ffd23f;--mint:#3ddc97;--sky:#4aa3ff;
--r0:#9aa3ad;--r1:#3ddc84;--r2:#4aa3ff;--r3:#b266ff;--r4:#ffd23f;--r5:#ff4d4d;
--f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
--f-big:"Dela Gothic One","Zen Maru Gothic","Hiragino Sans",sans-serif;
--f-num:"Chakra Petch","Roboto Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--bg);touch-action:manipulation}
canvas#view{position:absolute;left:0;top:0;right:0;bottom:var(--adh);width:100%;height:calc(100% - var(--adh));display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#tap{position:absolute;left:0;right:0;top:0;bottom:var(--adh);z-index:5;touch-action:none}
/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:8;padding-top:10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none}
.hud .l{justify-self:start}.hud .r{justify-self:end}
.chip{background:rgba(19,14,43,.72);border:1px solid var(--line);border-radius:14px;padding:6px 12px;text-align:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.chip small{display:block;font:700 10px/1 var(--f-ui);color:var(--mute);letter-spacing:.08em}
.chip b{display:block;font:700 26px/1.1 var(--f-num);font-variant-numeric:tabular-nums;margin-top:3px}
.chip b.bump{animation:bump .12s}
@keyframes bump{50%{transform:scale(1.25);color:var(--sun)}}
.tm{text-align:center}
.tm small{display:block;font:700 11px/1 var(--f-ui);letter-spacing:.14em;color:var(--mute)}
.tm b{display:block;font:700 54px/1 var(--f-num);font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.tm.low b{color:#ff6b6b;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.bar{width:150px;height:8px;border-radius:9px;background:#2b2255;margin:6px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sun),var(--pop));transform-origin:left}
.icon{pointer-events:auto;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(19,14,43,.72);font-size:18px;display:grid;place-items:center;cursor:pointer}
/* overlays */
.ov{position:absolute;left:0;right:0;top:0;bottom:var(--adh);z-index:20;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:18px;overflow:auto}
.ov.center{justify-content:center}
.ov.dim{background:rgba(19,14,43,.62)}
.ov.solid{background:radial-gradient(120% 80% at 50% 0,#2a1f63 0,var(--bg) 60%)}
.eyebrow{font:700 12px/1 var(--f-num);letter-spacing:.3em;color:var(--sun)}
h2{margin:0;font:900 26px/1.25 var(--f-ui)}
p{margin:0}
.note{font-size:12px;color:var(--mute);line-height:1.6}
.btn{border:0;border-radius:999px;background:var(--pop);color:#2a0a1c;font:900 20px/1 var(--f-ui);padding:16px 34px;box-shadow:0 5px 0 var(--pop-d);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pop-d)}
.btn.sub{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 #0f0a26;border:1px solid var(--line);font-size:15px;padding:13px 20px}
.btn.sub:active{box-shadow:0 1px 0 #0f0a26}
.btn.mini{font-size:12px;padding:8px 14px;box-shadow:0 3px 0 #0f0a26;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.icon:focus-visible,.dx:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* title */
#title{justify-content:space-between}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}
.logo .a{font:900 20px/1 var(--f-ui);color:var(--mute);letter-spacing:.1em}
.logo .b{font:400 74px/1 var(--f-big);color:var(--sun);text-shadow:0 4px 0 #b57b00,0 8px 0 rgba(0,0,0,.35);transform:rotate(-3deg)}
.logo .c{font:400 46px/1 var(--f-big);color:var(--pop);text-shadow:0 3px 0 var(--pop-d);transform:rotate(2deg)}
.stats{display:flex;gap:8px;width:100%;max-width:360px}
.stats .chip{flex:1;padding:8px 6px}.stats .chip b{font-size:20px}
.how{font-size:13px;line-height:1.7;color:var(--ink);background:rgba(19,14,43,.7);border:1px solid var(--line);border-radius:14px;padding:10px 14px;max-width:360px}
.how em{font-style:normal;color:var(--sun);font-weight:900}
.bottom{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
/* ready / toast */
#ready{align-items:center;justify-content:center;pointer-events:none;z-index:12;background:none}
.big-num{font:400 150px/1 var(--f-big);color:var(--sun);text-shadow:0 6px 0 #b57b00,0 0 40px rgba(255,210,63,.6);animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:0;right:0;top:118px;z-index:12;text-align:center;pointer-events:none}
.toast div{display:inline-block;padding:10px 20px;border-radius:16px;background:rgba(19,14,43,.86);border:2px solid var(--sun);font:900 18px/1.4 var(--f-ui);animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
.toast small{display:block;font-size:12px;font-weight:700;color:var(--mute)}
.hintTap{position:absolute;left:0;right:0;bottom:calc(var(--adh) + 8%);z-index:7;text-align:center;pointer-events:none;font:400 30px/1.3 var(--f-big);color:#fff;text-shadow:0 4px 0 var(--pop-d),0 0 24px rgba(255,95,162,.8);animation:pulse .45s infinite alternate}
/* timeup */
.panel{background:rgba(31,23,71,.92);border:1px solid var(--line);border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px;width:calc(100% - 32px)}
.panel .n{font:700 64px/1 var(--f-num);color:var(--sun)}
/* reveal */
#reveal{background:#0a0718;padding:0;gap:0;overflow:hidden;z-index:30}
#reveal .bgk{position:absolute;inset:0;background:#0a0718;transition:background .7s}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rv-top{position:absolute;left:0;right:0;top:0;padding-top:max(12px,env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;z-index:6}
.rv-top span{font:700 14px/1 var(--f-num);color:var(--mute);background:rgba(0,0,0,.4);padding:8px 12px;border-radius:99px}
.rv-stage{position:absolute;inset:0;z-index:3;pointer-events:none}
.rv-stage>*{position:absolute;left:0;right:0;text-align:center;margin:0 auto;transition:opacity .25s}
.rv-big{top:11%;font:400 clamp(70px,28vw,170px)/1 var(--f-big);letter-spacing:.04em;opacity:0}
.rv-big.s1{font-size:clamp(70px,26vw,150px)}.rv-big.s2{font-size:clamp(70px,24vw,140px)}
.rv-big.on{opacity:1;animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{from{transform:scale(3.2);opacity:0}to{transform:none;opacity:1}}
.rv-cap{top:34%;width:124px;height:124px;margin-top:0;opacity:0}
.rv-cap.on{opacity:1;animation:capshake .09s linear infinite}
.rv-cap i{position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,var(--cc,#ff5a5f) 0 50%,#f4f1ff 50% 100%);box-shadow:inset -8px -10px 18px rgba(0,0,0,.25),inset 8px 8px 14px rgba(255,255,255,.45),0 0 36px var(--cg,rgba(255,255,255,.35))}
.rv-cap i::after{content:"";position:absolute;left:8%;right:8%;top:calc(50% - 2px);height:4px;background:rgba(0,0,0,.18)}
.rv-cap.sph i{background:none;box-shadow:none;display:grid;place-items:center;font-size:96px;line-height:1}
.rv-cap.sph i::after{display:none}
@keyframes capshake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(calc(var(--sh,3px)*-1),var(--sh,3px)) rotate(-5deg)}50%{transform:translate(var(--sh,3px),calc(var(--sh,3px)*-1)) rotate(5deg)}75%{transform:translate(calc(var(--sh,3px)*-1),0) rotate(-3deg)}100%{transform:translate(0,0)}}
.rv-item{top:30%;font-size:min(36vw,170px);line-height:1.1;opacity:0;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
.rv-item.on{opacity:1;animation:itemin .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes itemin{from{transform:scale(.1) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.rv-item.float{animation:itemin .9s cubic-bezier(.2,1.2,.4,1) both,floaty 3s ease-in-out .9s infinite}
@keyframes floaty{50%{transform:translateY(-10px)}}
.rv-new{top:30%;left:auto;right:12%;width:auto;margin:0;font:900 14px/1 var(--f-num);color:#2a0a1c;background:var(--sun);padding:6px 10px;border-radius:99px;transform:rotate(12deg);opacity:0}
.rv-new.on{opacity:1;animation:pop .4s .3s cubic-bezier(.2,1.6,.4,1) both}
.rv-name{top:62%;font:900 26px/1.3 var(--f-ui);opacity:0;padding:0 16px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.rv-desc{top:70%;font:500 14px/1.6 var(--f-ui);color:#d6d0f2;opacity:0;padding:0 24px;max-width:420px}
.rv-tag{top:75.5%;opacity:0}
.rv-tag span{display:inline-block;font:700 11px/1 var(--f-ui);padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
.rv-name.on,.rv-desc.on,.rv-tag.on{opacity:1}
.rv-hint{position:absolute;left:0;right:0;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:5;text-align:center;font:700 13px/1 var(--f-ui);color:var(--mute);opacity:0;pointer-events:none}
.rv-hint.on{opacity:1;animation:pulse .7s infinite alternate}
.rv-tiles{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-content:flex-end;max-height:84px;overflow:hidden;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));font-size:19px;line-height:1.1;pointer-events:none}
.rv-tiles span{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:rgba(255,255,255,.07)}
.rv-flash{position:absolute;inset:0;z-index:7;pointer-events:none;background:var(--fc,#fff);opacity:0}
.rv-flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.rv-stage.shake{animation:stageshake .08s linear infinite}
@keyframes stageshake{0%{transform:translate(-5px,3px)}50%{transform:translate(5px,-4px)}100%{transform:translate(-3px,-3px)}}
.t0{color:var(--r0)}.t1{color:var(--r1)}.t2{color:var(--r2)}.t3{color:var(--r3)}.t4{color:var(--r4)}.t5{color:var(--r5)}
.t6,.t7{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.t6{background-image:linear-gradient(90deg,#ff4d4d,#ffb224,#ffe23f,#3ddc84,#4aa3ff,#b266ff,#ff4d9a,#ff4d4d);background-size:200% 100%;animation:slide 2s linear infinite}
.t7{background-image:linear-gradient(120deg,#7a4dff,#ff4dd8,#4de1ff,#ffffff,#7a4dff);background-size:220% 100%;animation:slide 3s linear infinite}
@keyframes slide{to{background-position:-200% 0}}
.rv-big.t0,.rv-big.t1,.rv-big.t2,.rv-big.t3,.rv-big.t4,.rv-big.t5{text-shadow:0 0 30px currentColor,0 5px 0 rgba(0,0,0,.45)}
.rv-big.t6{filter:drop-shadow(0 0 22px rgba(255,255,255,.55))}.rv-big.t7{filter:drop-shadow(0 0 26px rgba(160,120,255,.9))}
/* summary */
.score{font:700 74px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--sun);text-shadow:0 4px 0 #b57b00}
.rank-title{font:900 20px/1.3 var(--f-ui);color:var(--pop)}
.dist{width:100%;max-width:360px;display:flex;flex-direction:column;gap:5px}
.dist div{display:grid;grid-template-columns:44px 1fr 44px 56px;align-items:center;gap:8px;font:700 13px/1 var(--f-num)}
.dist .lb{text-align:left;font-family:var(--f-ui);font-weight:900}
.dist .bk{height:8px;border-radius:9px;background:#2b2255;overflow:hidden}.dist .bk i{display:block;height:100%;background:currentColor}
.dist .ct{text-align:right}.dist .pt{text-align:right;color:var(--mute)}
.best{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 16px;max-width:360px;width:100%;text-align:left}
.best .e{font-size:40px;line-height:1}.best b{display:block;font-size:15px}.best small{color:var(--mute);font-size:12px}
.nm{width:100%;max-width:300px;border:2px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);font:700 18px/1 var(--f-ui);padding:13px 14px;text-align:center}
.nm:focus-visible{outline:3px solid var(--sun);border-color:var(--sun)}
/* dex */
.dexhead{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px}
.pbar{height:10px;border-radius:9px;background:#2b2255;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun),var(--pop))}
.dexlist{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;text-align:left}
.dexsec h3{margin:0 0 8px;font:900 15px/1 var(--f-ui);display:flex;justify-content:space-between;align-items:baseline}
.dexsec h3 small{font:700 12px/1 var(--f-num);color:var(--mute)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dx{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.dx .e{font-size:32px;line-height:1.1}.dx .nmx{font:700 10px/1.25 var(--f-ui);color:var(--mute);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx.off{cursor:default}
.dx .cn{font:700 10px/1 var(--f-num);color:var(--sun)}
.detail{position:absolute;inset:0;z-index:40;background:rgba(10,7,24,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.detail .panel{gap:6px}.detail .e{font-size:96px;line-height:1.1}
.detail h4{margin:0;font:900 22px/1.3 var(--f-ui)}
.chipr{display:inline-block;font:900 13px/1 var(--f-big);padding:6px 12px;border-radius:99px;border:2px solid currentColor}
/* rank */
.tabs{display:flex;gap:8px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:99px;padding:9px 18px;font:900 14px/1 var(--f-ui);cursor:pointer}
.tab[aria-pressed=true]{background:var(--sun);color:#2a1d00;border-color:var(--sun)}
.rk{list-style:none;margin:0;padding:0;width:100%;max-width:380px;display:flex;flex-direction:column;gap:6px}
.rk li{display:grid;grid-template-columns:42px 1fr auto auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:700 14px/1.2 var(--f-ui);text-align:left}
.rk li:nth-child(1) span:first-child{color:var(--sun)}.rk li.me{border-color:var(--pop);box-shadow:0 0 0 2px rgba(255,95,162,.4)}
.rk .sc{font-family:var(--f-num);font-size:16px;color:var(--sun);font-variant-numeric:tabular-nums}.rk .cs{font:500 11px/1 var(--f-ui);color:var(--mute)}
.ad-banner{position:absolute;left:0;right:0;bottom:0;height:var(--adh);padding-bottom:env(safe-area-inset-bottom,0px);z-index:50;display:flex;align-items:center;justify-content:center;background:#0c0820;overflow:hidden}
.rv-item.q{animation:none;opacity:1;font-size:min(30vw,130px)}
.rv-big.ltr{opacity:1;display:flex;justify-content:center}.rv-big.ltr span{display:inline-block;opacity:0}
.rv-big.ltr span.on{animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
.mute{position:absolute;z-index:60;top:max(10px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.cp{position:absolute;width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,var(--c) 0 50%,#f4f1ff 50% 100%);box-shadow:inset -5px -6px 10px rgba(0,0,0,.25),inset 5px 5px 8px rgba(255,255,255,.45);animation:flt 4s ease-in-out infinite alternate;opacity:.9}
@keyframes flt{from{transform:translateY(0) rotate(-12deg)}to{transform:translateY(-14px) rotate(14deg)}}
.dist .lb.t6,.dist .lb.t7{display:inline-block}
.dist div.z{opacity:.35}
#gflash{z-index:15}
.rv-cap canvas{position:absolute;left:0;top:0;width:100%;height:100%;transition:transform .4s cubic-bezier(.2,.8,.3,1),opacity .4s}
.rv-cap.open{opacity:1;animation:none}
.rv-cap.open #capT{transform:translate(-30px,-100px) rotate(-38deg);opacity:0}
.rv-cap.open #capB{transform:translate(10px,80px) rotate(14deg);opacity:0}
.rv-cap.glow{filter:drop-shadow(0 0 26px var(--cg))}
.rv-big.s0{font-size:46px;top:14%}
.rv-item{top:29%}
.rv-item{width:min(44vw,190px);height:min(44vw,190px);font-size:0}
.rv-item svg{width:100%;height:100%;display:block}
.rv-cap .capS{position:absolute;inset:0;display:none}
.rv-cap.sph canvas{display:none}.rv-cap.sph .capS{display:block;filter:drop-shadow(0 0 22px var(--cg))}
.rv-tiles span{padding:2px}.rv-tiles span svg{width:100%;height:100%;display:block}
.dx .e{width:46px;height:46px;font-size:0}.dx .e svg{width:100%;height:100%;display:block}
.dx.off .e svg{filter:brightness(0);opacity:.3}
.best .e{width:52px;height:52px;font-size:0;flex:none}.best .e svg{width:100%;height:100%}
.detail .e{width:128px;height:128px;font-size:0}.detail .e svg{width:100%;height:100%}
.rv-pts{top:77.5%;font:700 34px/1 var(--f-num);color:var(--sun);text-shadow:0 0 18px rgba(255,210,63,.55),0 3px 0 rgba(0,0,0,.5);opacity:0}
.rv-pts.on{opacity:1;animation:pop .45s .15s cubic-bezier(.2,1.6,.4,1) both}
/*svg-shadow*/.rv-item svg,.dx .e svg,.best .e svg,.detail .e svg{filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.dx.off .e svg{filter:brightness(0);opacity:.3}
@media (prefers-reduced-motion:reduce){.big-num,.toast div,.rv-big.on,.rv-item.on,.rv-cap.on,.tm.low b,.hintTap,.rv-hint.on{animation:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
<canvas id="view"></canvas>
<div id="tap" hidden></div>
<div class="hud gut" id="hud" hidden>
  <div class="l chip"><small>出たカプセル</small><b id="hSpin">0</b></div>
  <div class="tm" id="hTm"><small>のこり</small><b id="hTime">15.00</b><div class="bar"><i id="hBar"></i></div></div>
  <div class="r"></div>
</div>
<button class="icon mute" id="mute" aria-label="サウンド切り替え">🔊</button>
<div class="toast" id="toast" hidden></div>
<div class="hintTap" id="hint" hidden>つまみを指でぐるぐる!<br><small style="font:700 14px var(--f-ui);text-shadow:none;color:#fff">2回転で1カプセル出るよ</small></div>
<div class="rv-flash" id="gflash"></div>

<section class="ov solid gut" id="title">
  <i class="cp" style="--c:#ff5a5f;left:8%;top:34%"></i><i class="cp" style="--c:#4aa3ff;right:9%;top:30%;animation-delay:-1s"></i>

function addTile(id){const t=el('rvTiles'),s=document.createElement('span');s.innerHTML=ART[id];s.style.boxShadow=`inset 0 0 0 1px ${RC[ITEMS[id][0]]}88`;t.appendChild(s);const max=Math.max(8,Math.floor(FW/26))*3;while(t.children.length>max)t.firstChild.remove()}
function revInit(){fxResize();fxClear();fxOn=true;rvTick.l=0;rvLoop=requestAnimationFrame(rvTick);RV.abort=false;RV.skipAll=false;RV.seen=G.seen;hideStage()}

async function forceReveal(id){const t0=performance.now();show('reveal');$('mute').hidden=true;el('rvTiles').textContent='';el('rvSkip').hidden=true;el('rvCnt').textContent='強制ストップ!';revInit();

async function runReveal(){

/* summary */
function showSummary(){G.state='summary';show('summary');
  const cnt=Array(8).fill(0);G.prizes.forEach(i=>cnt[ITEMS[i][0]]++);
  const sc=G.score,sEl=$('sScore');let t0=performance.now();const dur=clamp(sc/4,300,1500);(function up(){const k=clamp((performance.now()-t0)/dur,0,1);sEl.textContent=fmt(Math.round(sc*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(up)})();

    const c=document.createElement('span');c.className='ct';c.textContent='×'+cnt[r];const p=document.createElement('span');p.className='pt';p.textContent=fmt(cnt[r]*PTS[r])+'点';row.append(lb,bk,c,p);d.appendChild(row)}
  let bi=-1;G.prizes.forEach(i=>{if(bi<0||ITEMS[i][0]>ITEMS[bi][0])bi=i});const b=$('sBest');b.hidden=bi<0;
  if(bi>=0){const it=ITEMS[bi];b.textContent='';const e=document.createElement('span');e.className='e';e.innerHTML=ART[bi];const w=document.createElement('div');const nb=document.createElement('b');nb.textContent=it[2];const sm=document.createElement('small');sm.textContent='今回のベスト・'+RN[it[0]];w.append(nb,sm);b.append(e,w)}
  const nw=[...new Set(G.prizes)].filter(i=>!G.known.has(i)).length;$('sNew').textContent=nw?'📖 図鑑に新しく '+nw+'種 登録! ('+dexCount()+'/'+ITEMS.length+')':'図鑑 '+dexCount()+'/'+ITEMS.length;
  const can=sc>0&&!G.reg;$('nameIn').hidden=$('bReg').hidden=!can;$('nameIn').value=lsGet('gacha.name','');$('bReg').disabled=false;$('bReg').textContent='ランキングに登録';$('sRes').textContent=sc>0?'':'カプセルが出なかったのでランキング対象外です'}
$('bReg').onclick=async()=>{const n=($('nameIn').value.trim()||'ななし').slice(0,8);lsSet('gacha.name',n);G.reg=true;$('bReg').disabled=true;$('bReg').textContent='登録中…';
  const e={n,s:G.score,c:G.spins,d:todayJST(),ts:Date.now()};const loc=rkAdd(e);let r=loc,online=false;
  const o=await fbSubmit(e);if(o){r=o;online=true}
  $('nameIn').hidden=$('bReg').hidden=true;$('sRes').textContent=(online?'みんなの中で ':'この端末の記録で ')+'総合 '+r.all+'位 / 今日 '+r.daily+'位'};

function openDex(){show('dex');const n=dexCount();$('dxCnt').textContent=n+' / '+ITEMS.length+' 種 コンプリート '+Math.round(n/ITEMS.length*100)+'%';$('dxBar').style.width=(n/ITEMS.length*100)+'%';

function openDetail(i){const it=ITEMS[i],d=$('dxDet');d.textContent='';const p=document.createElement('div');p.className='panel';

/* ranking */
const RK='gacha.rank.v1';let memRank=[];
function rkLoad(){const v=lsGet(RK,null);return Array.isArray(v)?v:memRank}
const cmp=(a,b)=>b.s-a.s||a.c-b.c;
const CL={all:null,day:null,d:'',busy:false,error:false};let FB=null,rkTab='all',mine=null;
function fbInit(){if(!ONLINE)return Promise.resolve(null);
  if(!FB)FB=(async()=>{const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),F=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');return{F,db:F.getFirestore(A.initializeApp(FBCFG))}})().catch(e=>{console.error('Firebase初期化に失敗',e);FB=null;CL.error=true;return null});return FB}
async function fbSubmit(e){const f=await fbInit();if(!f)return null;
  try{const{F,db}=f,col=F.collection(db,'gacha');await F.addDoc(col,{n:e.n,s:e.s,c:e.c,d:e.d,ts:F.serverTimestamp()});CL.all=null;CL.day=null;
    const c=await F.getCountFromServer(F.query(col,F.where('s','>',e.s))),dl=await F.getDocs(F.query(col,F.where('d','==',e.d),F.limit(500)));let dr=1;dl.forEach(x=>{if(x.data().s>e.s)dr++});
    return{all:c.data().count+1,daily:dr}}catch(err){console.error(err);return null}}
async function fbFetch(){const f=await fbInit();if(!f){CL.error=true;return false}
  try{const{F,db}=f,col=F.collection(db,'gacha'),d=todayJST();
    const[a,b]=await Promise.all([F.getDocs(F.query(col,F.orderBy('s','desc'),F.limit(20))),F.getDocs(F.query(col,F.where('d','==',d),F.limit(500)))]);
    const mk=q=>{const r=[];q.forEach(x=>{const v=x.data();r.push({n:v.n,s:v.s,c:v.c,d:v.d})});return r};
    CL.all=mk(a);CL.day=mk(b).sort(cmp).slice(0,20);CL.d=d;CL.error=false;return true}catch(err){console.error('ランキングの読み込みに失敗',err);CL.error=true;return false}}
function rkAdd(e){const all=rkLoad().concat([e]).sort(cmp).slice(0,100);lsSet(RK,all);memRank=all;mine=e.n+'|'+e.s+'|'+e.d+'|'+e.c;return{all:all.indexOf(e)+1,daily:all.filter(x=>x.d===e.d).indexOf(e)+1}}
function renderRank(){const d=todayJST(),local=rkLoad(),cloud=ONLINE&&CL.all&&CL.d===d;
  const src=cloud?(rkTab==='day'?CL.day:CL.all):(rkTab==='day'?local.filter(x=>x.d===d):local),list=src.slice(0,cloud?20:10);
  $('tabAll').setAttribute('aria-pressed',rkTab==='all');$('tabDay').setAttribute('aria-pressed',rkTab==='day');
  $('rkSub').textContent=(cloud?'みんなの記録':CL.busy?'読み込み中…':CL.error?'みんなの記録を読み込めませんでした(この端末の記録)':!ONLINE?'この端末の記録':'この端末の記録')+(rkTab==='day'?' ・ '+d:' ・ 総合');
  const ol=$('rkList');ol.textContent='';$('rkEmpty').hidden=list.length>0;
  list.forEach((e,i)=>{const li=document.createElement('li');if(mine&&mine===e.n+'|'+e.s+'|'+e.d+'|'+e.c)li.className='me';
    const a=[(i+1)+'位',e.n,fmt(e.s)+'点',e.c+'個'];a.forEach((t,k)=>{const s=document.createElement('span');s.textContent=t;if(k===2)s.className='sc';if(k===3)s.className='cs';li.appendChild(s)});ol.appendChild(li)})}
async function openRank(){show('rank');CL.error=false;renderRank();if(ONLINE){CL.busy=true;renderRank();const ok=await fbFetch();CL.busy=false;if(!ok)CL.error=true;if(!$('rank').hidden)renderRank()}}
